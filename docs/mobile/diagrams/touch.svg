<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" role="img" aria-labelledby="title desc">
  <title id="title">父容器中途拦截触摸事件的时序</title>
  <desc id="desc">DOWN 时子 View 接受手势，MOVE 时父 ViewGroup 决定拦截，子 View 收到 CANCEL，后续由父处理。</desc>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#557293"/></marker><style>text{font-family:system-ui,'Microsoft YaHei',sans-serif;fill:#20354c}.h{font-size:21px;font-weight:700}.t{font-size:16px}.s{font-size:14px;fill:#516a82}.edge{fill:none;stroke:#557293;stroke-width:2;marker-end:url(#a)}</style></defs>
  <rect width="760" height="420" rx="12" fill="#f3f7fb"/>
  <text x="28" y="37" class="h">同一手势途中拦截：子 View 会收到 CANCEL</text>
  <rect x="55" y="66" width="170" height="43" rx="8" fill="#dce9fa"/><text x="140" y="94" text-anchor="middle" class="t">输入事件</text>
  <rect x="285" y="66" width="190" height="43" rx="8" fill="#dce9fa"/><text x="380" y="94" text-anchor="middle" class="t">父 ViewGroup</text>
  <rect x="530" y="66" width="175" height="43" rx="8" fill="#e0f3ea"/><text x="618" y="94" text-anchor="middle" class="t">子 View</text>
  <path d="M140 109V353M380 109V353M618 109V353" stroke="#bdcbd9" stroke-dasharray="5 5"/>
  <path class="edge" d="M140 153H377"/><text x="235" y="140" text-anchor="middle" class="t">DOWN</text>
  <path class="edge" d="M380 171H615"/><text x="500" y="159" text-anchor="middle" class="s">不拦截 → 子项接受</text>
  <path class="edge" d="M140 227H377"/><text x="235" y="214" text-anchor="middle" class="t">MOVE</text>
  <rect x="289" y="237" width="182" height="32" rx="6" fill="#fff1dd"/><text x="380" y="258" text-anchor="middle" class="s">方向与距离满足拦截条件</text>
  <path class="edge" d="M380 293H615"/><text x="500" y="282" text-anchor="middle" class="t">CANCEL</text>
  <path class="edge" d="M140 340H377"/><text x="245" y="327" text-anchor="middle" class="s">后续 MOVE / UP</text>
  <text x="630" y="332" class="s">清理</text><text x="630" y="353" class="s">按下状态</text>
  <text x="28" y="395" class="s">本图展示单一子项的常见路径；多指、嵌套滚动和特殊分发逻辑需要单独分析。</text>
</svg>
